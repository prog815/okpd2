name: Daily OKPD2 Update

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 МСК
  workflow_dispatch:       # ручной запуск из вкладки Actions

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Install Kaggle CLI
      run: pip install -q kaggle

    - name: Build kaggle.json from secret (JSON или голый ключ)
      env:
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        python - <<'EOF'
        import json, os
        raw = os.environ["KAGGLE_KEY"].strip()
        assert raw, "Секрет KAGGLE_KEY пустой"

        # Секрет может содержать либо весь kaggle.json, либо только key
        if raw.startswith("{"):
            data = json.loads(raw)
            username = data.get("username", "eavprog")
            key = str(data.get("key", "")).strip()
        else:
            username = "eavprog"
            key = raw

        assert key, "Не удалось извлечь key из секрета"

        p = os.path.expanduser("~/.kaggle")
        os.makedirs(p, exist_ok=True)
        with open(os.path.join(p, "kaggle.json"), "w") as f:
            json.dump({"username": username, "key": key}, f)
        os.chmod(os.path.join(p, "kaggle.json"), 0o600)
        print(f"kaggle.json создан: username={username}")
        EOF

    - name: Verify access to notebooks (настоящая проверка авторизации)
      run: |
        kaggle kernels list --user eavprog --page-size 1
        echo "✅ Авторизация валидна: legacy-ключ принят Kaggle API"

    - name: Download current notebook
      run: |
        mkdir -p ./nb
        kaggle kernels pull eavprog/okpd2-classifier-downloader -p ./nb --metadata
        ls -la ./nb

    - name: Trigger new notebook run
      run: |
        kaggle kernels push -p ./nb
        echo "✅ Notebook run triggered"
